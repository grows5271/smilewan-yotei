function calc(r,c,sv){const sid=V().sid,d=PD(),rows=r.ing.map(([n,q,u])=>{const need=q*sv,ls=lots(c,n,d).filter(l=>l.u===u),lu=[];let rem=need;
  ls.forEach(l=>{const t=Math.min(rem,l.qty);if(t>0){lu.push({id:l.id,it:n,u,q:r2(t),exp:l.exp,ek:l.ek||'未確認',days:daysOf(l,d),loc:l.loc,ck:l.ck,ap:l.approx});rem=r2(rem-t)}});
  const use=r2(need-rem),sh=rem,pr=PRO(n),rf=ref(sid,n),pk=sh>0?Math.ceil(sh/pr.pack):0,price=rf?rf.price:null;
  return{n,u,need,use,sh,pk,pack:pr.pack,price,rf,rfk:rf?rf.kind:null,cost:sh>0?(price!=null?pk*price:null):0,left:pk?r2(pk*pr.pack-sh):0,lu,unc:S.lots.some(l=>l.c===c&&l.item===n&&!uOK(l,d)&&(l.qty>0||l.qUnk)),prov:lu.some(z=>z.ck!==T),apx:lu.some(z=>z.ap)}});
 return{rows,fill:rows.reduce((a,x)=>a+Math.min(1,x.use/x.need),0)/rows.length,cost:rows.some(x=>x.cost===null)?null:rows.reduce((a,x)=>a+x.cost,0)}}
const nearTxt=z=>`期限が近い${z.it}${z.q}${z.u}を使用（${fm(z.exp)}・${z.ek}${z.days===0?'・本日':z.days===1?'・明日':''}）`;

 if(c.st!=='ok')return{stop:'アレルギー・食事形態が未確認のため生成を停止しました。確認後に再実行してください。'};

 const ex=[],ok=[];
 RX().forEach(r=>{const bn=r.ing.filter(i=>c.ban.includes(i[0])||c.ban.includes(PRO(i[0]).n)).map(i=>i[0]);const last=S.cooks.filter(k=>k.c===S.cid&&k.r===r.id).map(k=>k.d).sort().pop();

 ok.forEach(x=>{const nl=x.k.rows.flatMap(r=>r.lu.filter(z=>z.days!==null&&z.days>=0&&z.days<=S.thr));x.nl=nl;x.nt=new Set(nl.map(z=>z.it)).size;x.minNear=nl.length?nl.map(z=>z.exp).sort()[0]:'9'});

 return{top:ok.slice(0,3),all:ok,ex,noCost:!all,sv,ver:c.ver,sid:V().sid,pd:d,nearAll,noNear:nearAll.length>0&&ok.every(x=>!x.nl.length)}}

const baseDay=(c,pr)=>S.base==='entry'?(entTd(c,pr)||(S.last[c]||{})[pr]||null):((S.last[c]||{})[pr]||null);

const consInfo=(pr,c)=>{const u=((S.cd||{})[c]||{})[pr];if(u&&u.d>0)return{D:u.d,src:'利用者別設定'};if(S.cons[pr]>0)return{D:S.cons[pr],src:'事業所標準'};const a=c&&actDays(c,pr);if(a)return{D:a,src:'購入間隔の平均'};if(pr==='D1'){const g=srcCalc()['実測']||[];if(g.length)return{D:g.reduce((a,b)=>a+b)/g.length,src:'資料平均'}}return null};

 if(a==='rdt'&&RK.draft){RK.draft.t=t.value;return}
 if(a==='rdq'&&RK.draft){RK.draft.ing[+t.dataset.k][1]=+t.value||0;return}
 const l=v.lines.find(x=>x.id===t.dataset.l);
 if(a==='dlr'){S.dlr._=t.value;save();return}
 if(a==='catq'){S.q=t.value;const e2=$('#catlist');if(e2)e2.innerHTML=catList();save();return}
 if(a==='fq'){S.fq[t.dataset.k]=t.value;const e2=$('#fqres');if(e2)e2.textContent=fqCalc();save();return}
 if(a==='lq'&&l&&!v.bought){l.qty=t.value;prefill(l,v);const rf=ref(v.sid,lkey(l)),x=lc(l);if(l.cp&&x.q!==null){l.amt=String(l.cp*x.q);const e2=$('#amt-'+l.id);if(e2)e2.value=l.amt}else if(l.same&&rf&&x.q!==null){l.amt=String(rf.price*x.q);const e2=$('#amt-'+l.id);if(e2)e2.value=l.amt}else autoAmt(l);payRefresh();return}
 if(a==='amt'&&l&&!v.bought){l.cp=null;l.amt=t.value;l.amtT=true;l.same=false;payRefresh();return}
 if((a==='dU'||a==='dv')&&l&&!v.bought){if(a==='dU')l.U=t.value;else l.val=t.value;autoAmt(l);payRefresh();return}
 if(a==='dep'){v.dep[+t.dataset.i]=t.value;payRefresh();return}
 if(a==='adjr'){v.adj[+t.dataset.i].r=t.value;payRefresh();return}
 if(a==='adja'){v.adj[+t.dataset.i].a=t.value;payRefresh();return}
 if(a==='rcpt'){v.rcpt=t.value;payRefresh();return}
 if(a==='txt'){v.txt[t.dataset.k]=t.value;const o=$('#c-'+t.dataset.k);if(o)o.outerHTML=cntHtml(t.dataset.k);const cb=document.querySelector('button[data-a=copy][data-k="'+t.dataset.k+'"]');if(cb)cb.disabled=!okc(t.dataset.k)}save()});

<script>
// 献立・買い物支援のネット版：納品物の画面（app.html）はそのまま使い、もとの /api/… を
// 週間予定表と同じ保存先（Googleドライブ＝GAS）へつなぐ。合言葉は週間予定表と同じ（同じ住所なので入れ直し不要）
(async () => {
  const GAS = 'https://script.google.com/macros/s/AKfycbxKEAUthQx9wiZKncHZR43jbSKjPfO2lYhlc2K5yXWJNXI_zA8wChdQTFlINEhLTDQO/exec';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const show = t => { const m = document.getElementById('m'); if (m) m.innerHTML = '<div class="card" style="margin:16px">' + t + '</div>'; };
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
  let pass = lsGet('smilewan_pass').trim();
  if (!pass) { pass = (prompt('合言葉を入れてください（週間予定表と同じ合言葉です）') || '').trim(); if (!pass) { show('合言葉を入れると開けます。画面を再読み込みしてください。'); return; } }
  // 保存先へ送る。返事が途中で消えたとき・通信が一瞬切れたときは少し待って試し直す
  const call = async body => {
    for (let k = 0; ; k++) {
      let t;
      try { const r = await fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pass, ...body }) }); t = await r.text(); }
      catch (e) { if (k < 4) { await sleep(3000 * (k + 1)); continue; } throw e; }
      let j; try { j = JSON.parse(t); } catch (e) { if (k < 2) { await sleep(3000); continue; } throw new Error('保存先の返事が読めませんでした'); }
      if (j.ok && j.app) { if (k < 5) { await sleep(1500 * (k + 1)); continue; } throw new Error('保存先の返事が届きませんでした'); }
      return j;
    }
  };
  show('読み込んでいます…');
  let rc, ch, st;
  try { [rc, ch, st] = await Promise.all([fetch('recipes.json', { cache: 'no-store' }).then(r => r.json()), fetch('choices.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({})), call({ op: 'kget' })]); }
  catch (e) { show('保存先につながりませんでした。時間をおいて再読み込みしてください。（' + (e && e.message || e) + '）'); return; }
  if (!st.ok) { if (/passcode/.test(st.error || '')) { lsSet('smilewan_pass', ''); show('合言葉が違います。再読み込みして、もう一度入れてください。'); } else show('保存先のエラー：' + st.error); return; }
  lsSet('smilewan_pass', pass);
  // 日付が変わった訪問（買い物を保存した物・献立だけ選んで買い物の無い物）は履歴に移し、次の訪問を新しく始められるようにする
  //   （納品物は利用者ごとに「今回の訪問」1件だけを持ち、翌日に進めるのはデモ用のボタンだけだったため）。履歴は週間予定表の記録にも使う
  const T0 = new Date(Date.now() + 9 * 36e5).toISOString().slice(0, 10), S0 = st.state; let moved = 0;
  if (S0 && S0.v) {
    S0.hist = S0.hist || []; const seen = new Set(S0.hist.map(h => h.reqId));
    Object.entries(S0.v).forEach(([c, v]) => {
      if (!v || !c) return;
      const done = v.bought && String(v.bought.pdate || '') < T0, menuOnly = !v.bought && !(v.lines || []).length && v.plan && String(v.pd || '') < T0;
      if (!done && !menuOnly) return;
      if (!seen.has(v.reqId)) S0.hist.push({ reqId: v.reqId, c, n: (S0.cl && S0.cl[c] && S0.cl[c].n) || '', pd: v.pd || '', plan: v.plan ? { r: v.plan.r, rn: v.plan.rn } : null,
        bought: v.bought ? { id: v.bought.id, pdate: v.bought.pdate, pur: v.bought.pur, dsum: v.bought.dsum, chg: v.bought.chg, items: (v.bought.items || []).map(i => ({ pr: i.pr, tn: i.tn, n: i.n, qty: i.qty, amt: i.amt })) } : null });
      delete S0.v[c]; moved++;
    });
  }
  window.__INIT = S0; window.__REV = st.rev || 0; window.__RECIPES = rc; window.__CHOICES = ch;
  // もとの /api/… をここで受ける
  let srvRev = st.rev || 0, lastH = 0;
  const of = window.fetch.bind(window), res = (code, o) => new Response(JSON.stringify(o), { status: code, headers: { 'Content-Type': 'application/json' } });
  const hdr = (o, k) => { const h = (o && o.headers) || {}; return h[k] != null ? h[k] : h[k.toLowerCase()]; };
  window.fetch = async (u, o) => {
    const url = typeof u === 'string' ? u : (u && u.url) || '';
    if (!url.startsWith('/api/')) return of(u, o);
    try {
      // 他のPCの更新の確認：もとは8秒ごと。保存先の負担を抑えるため1分に1回だけ問い合わせる
      if (url === '/api/health') { if (Date.now() - lastH >= 60000) { lastH = Date.now(); const j = await call({ op: 'khealth' }); if (j.ok) srvRev = j.rev; } return res(200, { ok: true, rev: srvRev }); }
      if (url === '/api/state' && (!o || !o.method || o.method === 'GET')) { const j = await call({ op: 'kget' }); if (!j.ok) return res(500, { error: j.error }); srvRev = j.rev; return res(200, { rev: j.rev, state: j.state }); }
      if (url === '/api/state' && o.method === 'PUT') {
        let by = ''; try { by = decodeURIComponent(hdr(o, 'X-Operator') || ''); } catch (e) {}
        const j = await call({ op: 'kput', rev: Number(hdr(o, 'X-Rev') || 0), state: JSON.parse(o.body), by });
        if (j.conflict) { srvRev = j.rev; return res(409, { error: 'conflict', rev: j.rev }); }
        if (!j.ok) return res(400, { error: j.error || 'bad_request' });
        srvRev = j.rev; return res(200, { ok: true, rev: j.rev });
      }
      if (url === '/api/estat/refresh') {
        let by = ''; try { by = decodeURIComponent(hdr(o, 'X-Operator') || ''); } catch (e) {}
        let j = await call({ op: 'kestat', by });
        if (!j.ok && j.needAppId) { const id = (prompt('e-StatのアプリケーションIDを貼り付けてください（e-Statのマイページ→API機能で発行した物）') || '').trim(); if (id) { await call({ op: 'ksetappid', appId: id }); j = await call({ op: 'kestat', by }); } }
        if (!j.ok) return res(500, { error: j.error });
        srvRev = j.rev; return res(200, j);
      }
      return res(404, { error: 'not_found' });
    } catch (e) { return res(503, { error: String(e && e.message || e) }); }
  };
  // 納品物の画面を動かす
  const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
  if (moved) setTimeout(() => { try { save(); } catch (e) {} }, 800); // 履歴に移した分を保存
  // 統計価格の月1回の更新（もとはサーバーが行っていた）：前回から27日以上たっていれば裏で更新する（IDが未設定なら何もしない）
  try { const f = S0 && S0.fetched; if (f && (Date.now() - Date.parse(f + 'T00:00:00+09:00')) / 864e5 >= 27) call({ op: 'kestat', by: '自動更新' }).catch(() => {}); } catch (e) {}
})();
</script></body></html>
